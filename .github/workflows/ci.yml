name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  REGISTRY: harbor.10.0.0.200.nip.io
  IMAGE_NAME: library/minicloud-plane
  GITOPS_REPO: andrelair-platform/minicloud-gitops

jobs:
  # ── 1. Unit tests + static security ────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Run unit tests
        run: go test -v -count=1 ./...

      - name: Vulnerability check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Static security analysis (gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity high -confidence medium ./...

  # ── 2. Integration tests (httptest — no cluster needed) ─────────────────────
  integration-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Run integration tests
        run: go test -tags integration -v -count=1 -timeout=60s ./...

  # ── 3. Build, scan, sign ────────────────────────────────────────────────────
  build-and-push:
    needs: integration-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      digest: ${{ steps.build.outputs.digest }}
      branch: ${{ steps.meta.outputs.branch }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute build metadata
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          BRANCH=${GITHUB_REF_NAME}
          if [ "$BRANCH" = "main" ]; then
            TAG="${SHA}"
          else
            TAG="${BRANCH}-${SHA}"
          fi
          echo "image_tag=${TAG}"             >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}"             >> "$GITHUB_OUTPUT"
          echo "version=${SHA}"               >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA
        run: |
          sudo mkdir -p /etc/docker/certs.d/${{ env.REGISTRY }}
          echo "${{ secrets.MINICLOUD_CA_CERT }}" \
            | sudo tee /etc/docker/certs.d/${{ env.REGISTRY }}/ca.crt
          echo "${{ secrets.MINICLOUD_CA_CERT }}" \
            | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."harbor.10.0.0.200.nip.io"]
              insecure = true

      - name: Build and push to Harbor
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      - name: Install Cosign
        if: github.ref_name != 'dev'
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        if: github.ref_name == 'main'
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (CycloneDX JSON)
        if: github.ref_name == 'main'
        run: |
          syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} \
            -o cyclonedx-json=sbom.json

      - name: Sign image (keyless — GitHub OIDC → Sigstore Fulcio)
        if: github.ref_name != 'dev'
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Attach SBOM to image as OCI referrer
        if: github.ref_name == 'main'
        run: |
          cosign attach sbom \
            --sbom sbom.json \
            --type cyclonedx \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

  # ── 4. GitOps bump ──────────────────────────────────────────────────────────
  bump-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Determine overlay path
        id: overlay
        run: |
          case "${{ needs.build-and-push.outputs.branch }}" in
            main)    echo "path=services/minicloud-plane/minicloud-1/dev"     >> $GITHUB_OUTPUT ;;
            dev)     echo "path=services/minicloud-plane/minicloud-1/dev"     >> $GITHUB_OUTPUT ;;
          esac

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA
        run: |
          echo "${{ secrets.MINICLOUD_CA_CERT }}" \
            | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - name: Checkout minicloud-gitops
        uses: actions/checkout@v7
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: "5.6.0"

      - name: Verify image exists in Harbor before gitops bump
        run: |
          TAG="${{ needs.build-and-push.outputs.image_tag }}"
          URL="https://${{ env.REGISTRY }}/v2/${{ env.IMAGE_NAME }}/manifests/${TAG}"
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            --cacert /usr/local/share/ca-certificates/minicloud-ca.crt \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json" \
            -H "Authorization: Basic $(echo -n '${{ secrets.HARBOR_USER }}:${{ secrets.HARBOR_PASSWORD }}' | base64)" \
            "$URL")
          if [ "$STATUS" != "200" ]; then
            echo "Image $TAG not found in Harbor (HTTP $STATUS) — aborting gitops bump"
            exit 1
          fi
          echo "Image $TAG confirmed in Harbor (HTTP $STATUS)"

      - name: Bump image tag and open auto-merged PR
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          SHA="${{ needs.build-and-push.outputs.image_tag }}"
          BRANCH="ci/minicloud-plane-${SHA}"
          git checkout -b "${BRANCH}"
          cd "${{ steps.overlay.outputs.path }}"
          kustomize edit set image \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA}
          cd -
          git add "${{ steps.overlay.outputs.path }}/kustomization.yaml"
          if git diff --cached --quiet; then
            echo "No change — already at ${SHA}"
            exit 0
          fi
          git commit -S -m "ci(minicloud-plane): bump ${{ needs.build-and-push.outputs.branch }} to ${SHA}"
          git push origin "${BRANCH}"
          gh pr create \
            --repo ${{ env.GITOPS_REPO }} \
            --base main \
            --head "${BRANCH}" \
            --title "ci(minicloud-plane): bump ${{ needs.build-and-push.outputs.branch }} to ${SHA}" \
            --body "Automated image promotion from CI run ${{ github.run_id }}."
          gh pr merge "${BRANCH}" \
            --repo ${{ env.GITOPS_REPO }} \
            --admin --merge --delete-branch

  # ── 5. Post-deploy smoke test ───────────────────────────────────────────────
  # Waits for the BlueGreen Rollout to reach Healthy in minicloud-plane-dev,
  # then fires an HTTP probe via a transient curl pod inside the cluster.
  smoke-test:
    needs: bump-gitops
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA
        run: |
          echo "${{ secrets.MINICLOUD_CA_CERT }}" \
            | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - name: Set up kubectl
        run: |
          curl -sSL "https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl" -o kubectl
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_BASE64 }}" | base64 -d > ~/.kube/config

      - name: Wait for BlueGreen Rollout to reach Healthy (max 5 min)
        run: |
          echo "Waiting for ArgoCD to pick up the new image tag..."
          sleep 40
          for i in $(seq 1 27); do
            PHASE=$(kubectl get rollout minicloud-plane -n minicloud-plane-dev \
              -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            echo "[$i/27] phase=${PHASE}"
            if [ "$PHASE" = "Healthy" ]; then
              echo "Rollout is Healthy"
              exit 0
            fi
            if [ "$PHASE" = "Degraded" ]; then
              echo "Rollout is Degraded — aborting"
              kubectl describe rollout minicloud-plane -n minicloud-plane-dev || true
              exit 1
            fi
            sleep 10
          done
          echo "Timeout after 5 min waiting for Healthy"
          kubectl describe rollout minicloud-plane -n minicloud-plane-dev || true
          exit 1

      - name: HTTP smoke probe (curl pod in cluster)
        run: |
          kubectl run smoke-plane-${{ github.run_id }} \
            --image=curlimages/curl:8 \
            --restart=Never \
            --rm \
            -n minicloud-plane-dev \
            --timeout=30s \
            -- -sf --max-time 5 http://minicloud-plane:8080/health
          echo "Smoke probe: /health OK"

  # ── 6. k6 canary load injection (parallel with smoke-test) ──────────────────
  # Fires immediately after bump-gitops so k6 traffic is flowing DURING the
  # BlueGreen postPromotionAnalysis window. With initialDelay: 60s on the
  # AnalysisTemplate, the first gate check fires when k6 has ~120s of data.
  canary-load:
    needs: bump-gitops
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA
        run: |
          echo "${{ secrets.MINICLOUD_CA_CERT }}" \
            | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - name: Set up kubectl
        run: |
          curl -sSL "https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl" -o kubectl
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_BASE64 }}" | base64 -d > ~/.kube/config

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -q && sudo apt-get install -q k6

      - name: Wait for ArgoCD sync then port-forward active service
        run: |
          echo "Waiting 30s for ArgoCD to pick up the new image tag..."
          sleep 30
          kubectl port-forward svc/minicloud-plane 8080:8080 -n minicloud-plane-dev &
          echo "PF_PID=$!" >> $GITHUB_ENV
          sleep 3

      - name: Run k6 canary load test (5 min — covers postPromotionAnalysis window)
        run: k6 run -e CANARY_DURATION=5m k6/smoke.js

      - name: Teardown port-forward
        if: always()
        run: kill $PF_PID || true
