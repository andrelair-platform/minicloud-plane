name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GHCR_IMAGE: ghcr.io/andrelair-platform/minicloud-plane   # prod images (Internal, off local disk)
  GITOPS_REPO: andrelair-platform/minicloud-gitops

jobs:
  # ── 1. Unit tests + static security ────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Run unit tests
        run: go test -v -count=1 ./...

      - name: Vulnerability check (govulncheck)
        run: |
          # Pinned (not @latest) for reproducible builds — 12-factor #2. v1.8.0 needs Go >= 1.26;
          # CI runs Go 1.25, so v1.1.4 (the vuln DB is queried live regardless of binary version).
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Static security analysis (gosec)
        run: |
          # Pinned (not @latest) for reproducible builds — 12-factor #2 (Renovate bumps it via PR).
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -severity high -confidence medium ./...

  # ── 2. Integration tests (httptest — no cluster needed) ─────────────────────
  integration-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Run integration tests
        run: go test -tags integration -v -count=1 -timeout=60s ./...

  # ── 3. Build, scan, sign ────────────────────────────────────────────────────
  build-and-push:
    needs: integration-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write          # push prod images to ghcr.io
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      digest: ${{ steps.build.outputs.digest }}
      branch: ${{ steps.meta.outputs.branch }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute build metadata
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          BRANCH=${GITHUB_REF_NAME}
          if [ "$BRANCH" = "main" ]; then
            TAG="${SHA}"
          else
            TAG="${BRANCH}-${SHA}"
          fi
          echo "image_tag=${TAG}"             >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}"             >> "$GITHUB_OUTPUT"
          echo "version=${SHA}"               >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # ghcr only (Harbor decommissioned 2026-11-16); dev + prod both push ghcr.
          { echo "tags<<EOF"; echo "${{ env.GHCR_IMAGE }}:${TAG}"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push to Harbor
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      - name: Install Cosign
        if: github.ref_name != 'dev'
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        if: github.ref_name == 'main'
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (CycloneDX JSON)
        if: github.ref_name == 'main'
        run: |
          syft ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }} \
            -o cyclonedx-json=sbom.json

      - name: Sign image (keyless — GitHub OIDC → Sigstore Fulcio)
        if: github.ref_name != 'dev'
        run: |
          cosign sign --yes \
            ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Attach SBOM to image as OCI referrer
        if: github.ref_name == 'main'
        run: |
          cosign attach sbom \
            --sbom sbom.json \
            --type cyclonedx \
            ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}

      # Prod artifact lives in ghcr.io — sign + attach SBOM there too (same digest).
      - name: Sign ghcr image (keyless)
        if: github.ref_name == 'main'
        run: |
          cosign sign --yes \
            ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Attach SBOM to ghcr image
        if: github.ref_name == 'main'
        run: |
          cosign attach sbom \
            --sbom sbom.json \
            --type cyclonedx \
            ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}

  # ── Promotion + dev verification handled by KARGO, not CI ────────────────────
  # Build ends at a verified, immutable artifact (dual-push Harbor + ghcr, cosign, SBOM).
  # Kargo auto-promotes the main Freight to the dev Stage + runs the scale-aware dev
  # verification (services/minicloud-plane/kargo/analysis-dev-smoke.yaml, Variant D: pause the
  # KEDA cron scaler, wake dev, smoke, resume); prod is a manual CODEOWNERS-gated Kargo
  # promotion. No CI gitops bump.
